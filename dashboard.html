<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="dashboard">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-purple py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">
                <i class="fa-solid fa-list-check me-2 fs-4"></i>
                <span>TaskFlow <small class="fs-6 fw-normal opacity-75">| Firebase Todo</small></span>
            </a>
            <div id="auth-nav-section" class="d-flex align-items-center gap-2"></div>
        </div>
    </nav>

    <main class="container my-5">
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-purple" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-3">Loading TaskFlow...</p>
        </div>
        <div id="app-load-error" class="alert alert-danger d-none" role="alert"></div>

        <section id="todo-section" class="row justify-content-center" style="display: none;">
            <div class="col-lg-8">
                <div class="mb-4">
                    <h3 class="fw-bold">My Dashboard <i class="fa-solid fa-hand-sparkles text-warning"></i></h3>
                    <p class="text-muted mb-0">Organize your day. Complete your goals.</p>
                </div>

                <div class="card card-custom p-4 mb-4">
                    <h5 class="fw-bold mb-3 d-flex align-items-center">
                        <span class="purple-icon-bg me-2 fs-5"><i class="fa-solid fa-plus"></i></span>
                        Add New Task
                    </h5>
                    <form id="todo-form" class="input-group">
                        <input type="text" id="todo-input" class="form-control form-control-lg fs-6"
                            placeholder="Write your next milestone..." maxlength="300" required>
                        <button id="add-task-btn" class="btn btn-purple px-4 fw-bold" type="submit">
                            <i class="fa-solid fa-paper-plane me-1"></i>
                            Add Task
                        </button>
                    </form>
                    <div id="todo-alert" class="alert d-none mt-3 mb-0 small" role="alert"></div>
                </div>

                <div class="card card-custom p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">
                            <i class="fa-solid fa-list-check text-purple me-2"></i>
                            My Tasks
                        </h5>
                        <span id="task-count" class="badge rounded-pill px-3 py-2"
                            style="background-color: var(--purple-light); color: var(--purple-primary);">0 Tasks</span>
                    </div>
                    <div id="todo-loading" class="text-center py-4 d-none">
                        <div class="spinner-border spinner-border-sm text-purple" role="status">
                            <span class="visually-hidden">Loading tasks...</span>
                        </div>
                        <p class="text-muted small mt-2 mb-0">Loading your tasks...</p>
                    </div>
                    <ul id="todo-list" class="list-group list-group-flush border-0"></ul>
                    <div id="no-todos" class="text-center py-5 d-none">
                        <div class="purple-icon-bg mb-3 fs-3"><i class="fa-solid fa-clipboard-check"></i></div>
                        <h6 class="fw-bold">All caught up!</h6>
                        <p class="text-muted small mb-0">No tasks available. Add your first task!</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        function showAppLoadError(error) {
            document.getElementById("loading-spinner").classList.add("d-none");
            const errorBox = document.getElementById("app-load-error");
            errorBox.textContent = location.protocol === "file:"
                ? "Browser modules cannot load Firebase from a file URL. Open the site with VS Code Live Server."
                : `TaskFlow could not load its app or Firebase module: ${error?.message || "loading timed out"}. Check the browser Console and internet connection.`;
            errorBox.classList.remove("d-none");
        }

        window.setTimeout(() => {
            if (document.getElementById("loading-spinner").style.display !== "none") {
                showAppLoadError(new Error("Firebase initialization timed out"));
            }
        }, 15000);
    </script>
    <script type="module">
        import("./app.js").catch(showAppLoadError);
    </script>
</body>

</html>
